baseURL: "https://mikezornek.com"
locale: "en-US"
# Render themes/reborn/layouts/robots.txt. Off by default in Hugo, and while it
# was off the site served a 404 at /robots.txt, so no crawler was ever told
# where the sitemap lives. See decisions/ai-crawlers.md.
enableRobotsTXT: true
title: "Mike Zornek"
description: Personal website of Mike Zornek, a developer and teacher from the suburbs of Philadelphia.
theme: "reborn"
params:
  description: Personal website of Mike Zornek, a developer and teacher from the suburbs of Philadelphia.
  # Version segment in every generated social card URL (/og/<version>/...).
  # LinkedIn caches a link preview per exact URL effectively forever, so the only
  # way to reissue cards after a design change is to change their URLs. Bumping
  # this re-mints every card URL on the site at once. It lives here rather than
  # in a template so the partial that builds card URLs and the manifest that
  # tells the generator where to write them cannot disagree.
  ogCardVersion: v1
  fediverse_creator: "@zorn@jawns.club"
  author:
    name: Mike Zornek
    email: mike@mikezornek.com
  # The fixed-price consulting offer. Kept here so the site-wide availability
  # banner and the consulting page's offer box cannot drift apart. The price
  # also appears in the consulting page's `description` front matter, which
  # cannot be single-sourced from here: front matter is data, not a template,
  # so it cannot interpolate a param. Update that copy by hand.
  sprint:
    headline: "Two weeks. One problem. $6,000."
    price: "$6,000"
  # Facts about Mike-the-person, for the JSON-LD `Person` node emitted on the
  # home page and on blog posts. No other page type carries structured data.
  # See decisions/structured-data.md.
  #
  # This is editorial copy aimed at machines rather than readers, which is
  # exactly why it lives here instead of being buried in a template: it is the
  # answer to "who is this site about," and it should be as easy to revise as
  # any other bit of site copy.
  #
  # Keep it true. `sameAs` comes from data/profiles.yaml, so it is not repeated
  # here. The `sprint` block above is not read by the JSON-LD at all: the
  # `Offer` names the service and links the consulting page, but carries no
  # price. See decisions/structured-data.md for why.
  identity:
    # Short enough to read as a title, not a pitch. The homepage says "I
    # describe myself as both a developer and teacher"; this matches.
    jobTitle: Developer and Teacher
    description: Developer and teacher from the suburbs of Philadelphia, building digital products for over 25 years and working primarily in Elixir.
    # What Mike wants to be known for now, not an inventory of the archive.
    # These feed the entity association a search engine builds for him, so the
    # test is "is this what he does today," not "has he written about it."
    #
    # iOS Development is deliberately absent for exactly that reason. The site
    # has a real body of iOS writing and the /tags/ios/ archive stays up, but
    # it is history rather than current practice, and listing it here would
    # work against the Elixir positioning the consulting page is selling.
    # Don't re-add it from the tag counts.
    knowsAbout:
      - Elixir
      - Phoenix Framework
      - Software Craft
      - Software Consulting
    # Coarse on purpose. "Suburbs of Philadelphia" is what the homepage says,
    # and a street address has no business in a public JSON blob.
    addressRegion: PA
    addressCountry: US
    image: /images/zorn_square_256.webp
  # Series listed newest-first (personal logging). Others default to oldest-first
  # so reading-order series (e.g. tutorials) read top-to-bottom.
  seriesNewestFirst:
    - Journals
pagination:
  pagerSize: 20
markup:
  goldmark:
    extensions:
      typographer: true
    renderer:
      unsafe: true
mainSections:
  - posts

# Keep taxonomy term titles as authored (e.g. "ios", "ai") instead of
# auto-capitalizing to "Ios"/"Ai". Section pages set their own titles.
capitalizeListTitles: false

taxonomies:
  tag: tags
  series: series

related:
  includeNewer: true
  threshold: 80
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: series
      weight: 40
    - name: date
      weight: 10
menu:
  main:
    - name: Home
      url: /
      weight: 10
    - name: Blog
      url: /posts/
      weight: 20
    - name: Elixir Consulting
      url: /elixir-consulting/
      weight: 25
    - name: Values
      url: /values/
      weight: 50
    - name: Follow
      url: /follow/
      weight: 55
    - name: Now
      url: /now/
      weight: 59
    - name: Contact
      url: /contact/
      weight: 60
    - name: 🎲
      title: Read a random post
      url: /random/
      weight: 65

# `ogmanifest` is the work list for bin/og-images.mjs: one row per page that
# needs a generated social card. It is a build artifact for the generator, not a
# page, so `notAlternative` keeps it out of `.AlternativeOutputFormats` and off
# the `<link rel=alternate>` tags in the head.
outputFormats:
  ogmanifest:
    mediaType: application/json
    baseName: og-manifest
    isPlainText: true
    notAlternative: true

outputs:
  home: ["HTML", "RSS", "JSON", "ogmanifest"]

build:
  buildStats:
    enable: true
  cachebusters:
    - source: assets/notwatching/hugo_stats\.json
      target: css
    - source: (postcss|tailwind)\.config\.js
      target: css
    - source: assets/.*\.(.*)$
      target: $1
module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
